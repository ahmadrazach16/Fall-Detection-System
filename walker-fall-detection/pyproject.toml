[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falldet"
version = "0.1.0"
description = "Synthetic-data pipeline for fall detection in walker users: simulator, pose-based detectors, robustness benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "opencv-python-headless>=4.9", "matplotlib>=3.8", "joblib>=1.3"]

[tool.setuptools]
packages = ["falldet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
